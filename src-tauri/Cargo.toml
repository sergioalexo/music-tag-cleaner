[package]
name = "music-tag-cleaner"
version = "0.8.3"
description = "Strip audio tags to the essentials and clean them up with AI"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
lofty = "0.21"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
walkdir = "2"
tokio = { version = "1", features = ["time"] }
trash = "5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
rusty-chromaprint = "0.3.0"
symphonia = { version = "0.6.1", features = ["mp3", "flac", "aac", "isomp4", "wav", "ogg", "vorbis", "aiff"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
blake3 = "1.8.7"

[profile.release]
strip = true
lto = true
codegen-units = 1
